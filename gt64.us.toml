# N64Recomp config for GT 64: Championship Edition (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "syms.toml"
rom_file_path = "rom/GT64 - Championship Edition (USA).z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 50

[patches]
stubs = []
# Controller Pak internals only called by libultra PFS functions that the runtime replaces.
ignored = [
    "__osBlockSum", "__osClearPage", "__osPfsReleasePages", "__osPfsDeclearPage",
    "func_800555DC", "func_80055954", "func_800578A4", "func_80057A58",
]

# Controller thread polling loop: wait for a frame before each read (see gt_controller_wait in src/game/enhancements.cpp).
[[patches.hook]]
func = "func_800083F8"
before_vram = 0x80008460
text = "{ void gt_controller_wait(uint8_t*, recomp_context*); gt_controller_wait(rdram, ctx); }"

# Game ROM read routine: register/unregister the front-end code overlay (gt_on_rom_read in src/game/enhancements.cpp).
[[patches.hook]]
func = "func_80001A24"
before_vram = 0x80001A24
text = "{ void gt_on_rom_read(uint32_t, uint32_t, uint32_t); gt_on_rom_read((uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r6); }"

# Stats (src/main/debug_stats.cpp, GT_STATS=1): count task submits in the RSP task threads.
[[patches.hook]]
func = "func_80007C80"
before_vram = 0x80007D74
text = "{ void gt_stats_gfx_submit(void); gt_stats_gfx_submit(); void gt_debug_task(uint8_t*, uint32_t, int); gt_debug_task(rdram, (uint32_t)ctx->r17 + 0x28, 0); void gt_hd_wheels(uint8_t*, uint32_t); gt_hd_wheels(rdram, (uint32_t)ctx->r17 + 0x28); }"

[[patches.hook]]
func = "func_80007AC4"
before_vram = 0x80007B8C
text = "{ void gt_stats_gfx_submit(void); gt_stats_gfx_submit(); void gt_debug_task(uint8_t*, uint32_t, int); gt_debug_task(rdram, (uint32_t)ctx->r20 + 0x10, 1); }"

[[patches.hook]]
func = "func_80007AC4"
before_vram = 0x80007BE0
text = "{ void gt_stats_gfx_submit(void); gt_stats_gfx_submit(); void gt_debug_task(uint8_t*, uint32_t, int); gt_debug_task(rdram, (uint32_t)ctx->r16, 2); }"

[[patches.hook]]
func = "func_80007C80"
before_vram = 0x80007DE0
text = "{ void gt_debug_swap(uint32_t); gt_debug_swap((uint32_t)ctx->r4); }"

# 60 FPS: the scheduler (func_80007860) skips frame messages for clients when (mask & retrace & client flags) & 1,
# and the game sets the mask (0x800DB244) to 1 in some modes to cap them at 30. With 60 FPS on, read it as 0. The game
# times its logic by the elapsed time it accumulates per retrace (0x800F131C), so it runs at the same speed.
[[patches.hook]]
func = "func_80007860"
before_vram = 0x8000789C
text = "{ int gt_fps60_enabled(void); if (gt_fps60_enabled()) ctx->r14 = 0; }"

# Full-screen race view: the per-camera view (D_8010FFCC: +0xCC Vp, +0xD0 rect) is a 280x208 window inside a black
# border. src/game/enhancements.cpp widens it to the full frame before the camera's display list is built.
[[patches.hook]]
func = "func_8000A7DC"
before_vram = 0x8000A7DC
text = "{ void gt_race_view(uint8_t*); gt_race_view(rdram); }"

# Analog throttle and brake (src/game/enhancements.cpp): after the car input routine sets the throttle and brake
# flags (a0 = car + 0x200, v1 = the controller's OSContPad), record the trigger amounts; around the throttle and
# brake pedal updates (a0 = car), cap the pedal positions at those amounts.
[[patches.hook]]
func = "func_80033050"
before_vram = 0x800330B4
text = "{ void gt_analog_pedals(uint8_t*, uint32_t, uint32_t); gt_analog_pedals(rdram, (uint32_t)ctx->r4, (uint32_t)ctx->r3); }"

[[patches.hook]]
func = "func_8002D8B4"
before_vram = 0x8002D8B4
text = "{ void gt_pedal_begin(uint32_t); gt_pedal_begin((uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_8002D800"
before_vram = 0x8002D8A4
text = "{ void gt_pedal_end(uint8_t*, int); gt_pedal_end(rdram, 0); }"

[[patches.hook]]
func = "func_8002DB18"
before_vram = 0x8002DB18
text = "{ void gt_pedal_begin(uint32_t); gt_pedal_begin((uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_8002DAB0"
before_vram = 0x8002DAC4
text = "{ void gt_pedal_end(uint8_t*, int); gt_pedal_end(rdram, 1); }"

# Replays: note which record/playback buffer entry each port's pad came from, so analog pedal amounts can be kept with it.
[[patches.hook]]
func = "func_800081F0"
before_vram = 0x800081F0
text = "{ void gt_controller_poll(uint8_t*); gt_controller_poll(rdram); }"

[[patches.hook]]
func = "func_800081F0"
before_vram = 0x800082C0
text = "{ void gt_pad_entry(uint8_t*, int, uint32_t, int); gt_pad_entry(rdram, (int)ctx->r17, (uint32_t)ctx->r18, 0); }"

[[patches.hook]]
func = "func_800081F0"
before_vram = 0x80008328
text = "{ void gt_pad_entry(uint8_t*, int, uint32_t, int); gt_pad_entry(rdram, (int)ctx->r17, (uint32_t)ctx->r18, 1); }"

# Paks: a Controller Pak and a Rumble Pak in each controller, switched automatically. The boot probe (osPfsInitPak in
# func_80043CB4) answers as a Rumble Pak, so the game rumbles in races; the probe before each save or load
# (func_8004447C, called by the save routines) finds the Controller Pak, and keeps the rumble flag it would clear.
[[patches.hook]]
func = "func_80043CB4"
before_vram = 0x80043E18
text = "{ int32_t gt_pak_probe(int32_t, int32_t); ctx->r2 = (int64_t)gt_pak_probe((int32_t)ctx->r17, (int32_t)ctx->r2); }"

[[patches.hook]]
func = "func_8004447C"
before_vram = 0x800445FC
text = "{ ctx->r14 = (ctx->r14 & 0xFF0F) | (ctx->r13 & 0x00F0); }"

[[patches.hook]]
func = "func_80043990"
before_vram = 0x80043A4C
text = "{ void gt_rumble_log(int); gt_rumble_log(1); }"

[[patches.hook]]
func = "func_80043990"
before_vram = 0x80043A9C
text = "{ void gt_rumble_log(int); gt_rumble_log(0); }"

# Slip rumble: each frame's wheel contact for a car (func_80039AA4, a0 = the car) drives the rumble for its controller.
[[patches.hook]]
func = "func_80039AA4"
before_vram = 0x80039AA4
text = "{ void gt_slip_rumble(uint8_t*, uint32_t); gt_slip_rumble(rdram, (uint32_t)ctx->r4); }"

# Draw distance: draw the whole track ring, with the node pool and matrices allowed into the Expansion Pak's 4 MB.
[[patches.hook]]
func = "func_8000A350"
before_vram = 0x8000A47C
text = "{ int32_t gt_sections_behind(uint8_t*, int32_t); ctx->r18 = (int64_t)gt_sections_behind(rdram, (int32_t)ctx->r18); }"

[[patches.hook]]
func = "func_8000A350"
before_vram = 0x8000A500
text = "{ int32_t gt_sections_ahead(uint8_t*, int32_t); ctx->r18 = (int64_t)gt_sections_ahead(rdram, (int32_t)ctx->r18); }"

[[patches.hook]]
func = "func_8000A280"
before_vram = 0x8000A280
text = "{ void gt_add_section(uint8_t*, uint32_t); gt_add_section(rdram, (uint32_t)ctx->r4); return; }"

[[patches.hook]]
func = "func_80008858"
before_vram = 0x80008DC8
text = "{ void gt_matrix_buffer(uint8_t*, uint32_t); gt_matrix_buffer(rdram, (uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_8000A570"
before_vram = 0x8000A624
text = "{ void gt_track_segment(uint8_t*, recomp_context*); gt_track_segment(rdram, ctx); }"


# Save requests (the save thread's dispatcher): logged with GT_PAK_LOG.
[[patches.hook]]
func = "func_80005B80"
before_vram = 0x80005B80
text = "{ void gt_save_request(uint8_t*, uint32_t); gt_save_request(rdram, (uint32_t)ctx->r4); }"


# Automatic gearbox (src/game/enhancements.cpp): around the automatic transmission call in the gearbox routine
# (a0 = car), swap in the custom shift points, then restore them.
[[patches.hook]]
func = "func_8003412C"
before_vram = 0x8003414C
text = "{ void gt_auto_gearbox_begin(uint8_t*, uint32_t); gt_auto_gearbox_begin(rdram, (uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_8003412C"
before_vram = 0x80034154
text = "{ void gt_auto_gearbox_end(uint8_t*, recomp_context*); gt_auto_gearbox_end(rdram, ctx); }"

# Car detail by track sections from the camera (func_80028604, per car each frame): within 2 sections the full car; then
# no wheels or shadow (+0x119 bit 0x10); further out not even the full body (0x20). Cars about 2 sections away switched
# every few frames as they and the camera crossed sections, and their shadows flickered. The shadow's per-frame function
# (func_800377C0) skips on either bit: only on 0x20 now, so every car whose body is drawn has its shadow.
[[patches.hook]]
func = "func_800377C0"
before_vram = 0x80037804
text = "ctx->r24 &= ~(gpr)0x10;"

# A car's wheels (func_80036A08 front, func_80036AEC rear) are only updated while they're drawn, so a car coming back
# into full detail drew its wheels where they were when it left it for a frame (wheels jumping off the car).
# gt_wheel_drawn drops a car's wheels on its first frame back (after the object is added: see enhancements.cpp).
[[patches.hook]]
func = "func_80036A08"
before_vram = 0x80036AC4
text = "{ void gt_wheel_drawn(uint8_t*); gt_wheel_drawn(rdram); }"

[[patches.hook]]
func = "func_80036A08"
before_vram = 0x80036ADC
text = "{ void gt_wheel_drawn(uint8_t*); gt_wheel_drawn(rdram); }"

[[patches.hook]]
func = "func_80036AEC"
before_vram = 0x80036B8C
text = "{ void gt_wheel_drawn(uint8_t*); gt_wheel_drawn(rdram); }"

[[patches.hook]]
func = "func_80036AEC"
before_vram = 0x80036BA4
text = "{ void gt_wheel_drawn(uint8_t*); gt_wheel_drawn(rdram); }"

# Frame interpolation of the cars: each car part drawn from the object list (func_80009AA0: a matrix and a display
# list per part) gets an RT64 matrix group with an ID of its own (car and part), so the in-between frames pair every
# part with itself, not with another car's part that looks the same. See gt_part_begin/end in enhancements.cpp.
[[patches.hook]]
func = "func_80009AA0"
before_vram = 0x80009AB4
text = "{ void gt_part_begin(uint8_t*, uint32_t); gt_part_begin(rdram, (uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_80009AA0"
before_vram = 0x80009D38
text = "{ void gt_part_end(uint8_t*); gt_part_end(rdram); }"

# Car detail: cars 2 to about 5 track sections from the camera are drawn as bodies alone (func_80028604 sets +0x119
# bit 0x10), so their wheels switched on and off every few frames around 2 sections. gt_car_detail clears that bit:
# full cars out to where the game draws simpler bodies (0x20).
[[patches.hook]]
func = "func_80028604"
before_vram = 0x800287F8
text = "{ void gt_car_detail(uint8_t*); gt_car_detail(rdram); }"
