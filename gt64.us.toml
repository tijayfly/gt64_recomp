# N64Recomp config for GT 64: Championship Edition (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "syms.toml"
rom_file_path = "rom/GT64 - Championship Edition (USA).z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 50

[patches]
stubs = []
# Controller Pak internals only called by libultra PFS functions that the runtime replaces.
ignored = [
    "__osBlockSum", "__osClearPage", "__osPfsReleasePages", "__osPfsDeclearPage",
    "func_800555DC", "func_80055954", "func_800578A4", "func_80057A58",
]

# Controller thread polling loop: wait for a frame before each read (see gt_controller_wait in src/game/enhancements.cpp).
[[patches.hook]]
func = "func_800083F8"
before_vram = 0x80008460
text = "{ void gt_controller_wait(uint8_t*, recomp_context*); gt_controller_wait(rdram, ctx); }"

# Game ROM read routine: register/unregister the front-end code overlay (gt_on_rom_read in src/game/enhancements.cpp).
[[patches.hook]]
func = "func_80001A24"
before_vram = 0x80001A24
text = "{ void gt_on_rom_read(uint32_t, uint32_t, uint32_t); gt_on_rom_read((uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r6); }"

[[patches.hook]]
func = "func_800076A4"
before_vram = 0x80007734
text = "{ void gt_debug_sched_msg(uint8_t*, recomp_context*); gt_debug_sched_msg(rdram, ctx); }"

# Stats (src/main/debug_stats.cpp, GT_STATS=1): count task submits in the RSP task threads.
[[patches.hook]]
func = "func_80007C80"
before_vram = 0x80007D74
text = "{ void gt_stats_gfx_submit(void); gt_stats_gfx_submit(); void gt_debug_task(uint8_t*, uint32_t, int); gt_debug_task(rdram, (uint32_t)ctx->r17 + 0x28, 0); }"

[[patches.hook]]
func = "func_80007AC4"
before_vram = 0x80007B8C
text = "{ void gt_stats_gfx_submit(void); gt_stats_gfx_submit(); void gt_debug_task(uint8_t*, uint32_t, int); gt_debug_task(rdram, (uint32_t)ctx->r20 + 0x10, 1); }"

[[patches.hook]]
func = "func_80007AC4"
before_vram = 0x80007BE0
text = "{ void gt_stats_gfx_submit(void); gt_stats_gfx_submit(); void gt_debug_task(uint8_t*, uint32_t, int); gt_debug_task(rdram, (uint32_t)ctx->r16, 2); }"

[[patches.hook]]
func = "func_80007C80"
before_vram = 0x80007DE0
text = "{ void gt_debug_swap(uint32_t); gt_debug_swap((uint32_t)ctx->r4); }"
